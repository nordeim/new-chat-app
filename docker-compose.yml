# ══════════════════════════════════════════════════════════════════
# New Chat — Local Development Services
# ══════════════════════════════════════════════════════════════════
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Reset:   docker compose down -v  (WARNING: deletes all data)
#   Logs:    docker compose logs -f postgres
# ══════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL 17 ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: new_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    # Loopback-only: the repo publishes the credential, so the database must
    # not be reachable from other interfaces (pass-9 L-1).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chat_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chat_net

# ─── Named Volumes ─────────────────────────────────────────────────
volumes:
  chat_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────
networks:
  chat_net:
    driver: bridge
